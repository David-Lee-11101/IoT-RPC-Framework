name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test
        run: mvn --batch-mode --no-transfer-progress test
  tiny-rpc-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['8', '21']
    steps:
      - uses: actions/checkout@v4
        with:
          path: logic
      - uses: actions/checkout@v4
        with:
          repository: David-Lee-11101/Handwritten-Netty-RPC
          ref: 3d4e04f93a7a477fa9f77dbba756792120be74c1
          path: communication
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Install pinned current transport
        run: mvn --batch-mode --no-transfer-progress -f communication/pom.xml -pl tiny-rpc-netty -am install
      - name: Verify typed engine and real TinyRPC graph bridge
        run: mvn --batch-mode --no-transfer-progress -f logic/pom.xml -DtinyRpcAdapter -pl logic-engine-tiny-rpc-adapter -am test
