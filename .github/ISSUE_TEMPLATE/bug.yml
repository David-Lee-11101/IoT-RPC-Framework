name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or security exploit details. Use the security policy for sensitive reports.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including the smallest reproducible example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did the documentation or public contract lead you to expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, configuration shape, and sanitized logs.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Release, branch, or commit SHA where the problem occurs.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant OS, runtime, dependency, and deployment details.
