name: Feature proposal
description: Propose a focused capability or contract change.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete limitation or workflow that motivates this proposal.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State the observable behavior and who benefits from it.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and compatibility
      description: Note compatibility, migration, security, or operational constraints.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any existing workflow or smaller change that you considered.
